events {}

http {
  # Nginx only sets Connection: upgrade for actual WebSocket upgrade
  # requests; plain HTTP requests (e.g. GET /health) get "close" instead.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Round-robin (the default — no balancing method specified) is safe here
  # specifically because of the Redis pub/sub fan-out in apps/realtime-server:
  # every instance converges on the same Yjs state via Redis, so there's no
  # need to pin a document or user to one backend the way a stateful,
  # non-fan-out WS server would require (ip_hash / sticky sessions).
  upstream realtime_backend {
    server host.docker.internal:3002;
    server host.docker.internal:3003;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://realtime_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      # WebSocket connections are long-lived — nginx's 60s default proxy
      # timeout would silently drop idle collaborators.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
